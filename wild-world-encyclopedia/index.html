<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おい森 生き物チェッカー（魚・虫 統合版）</title>
    <style>
        :root {
            --bg-color: #fcfbf5;
            --primary-green: #5d9e5a;
            --accent-brown: #6b4c37;
            --header-bg: #82b66a;
            --text-color: #4a4a4a;
        }
        body {
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0dec5 15%, transparent 16%), radial-gradient(#e0dec5 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid var(--accent-brown);
        }
        h1 {
            text-align: center;
            color: var(--accent-brown);
            border-bottom: 3px dashed var(--primary-green);
            padding-bottom: 10px;
        }
        .controls {
            background: #ecf5e6;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #cce3c2;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: var(--accent-brown);
        }
        .input-group {
            margin-bottom: 15px;
        }
        input, select, button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-green);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: var(--accent-brown);
        }
        .weather-toggle {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .weather-btn {
            flex: 1;
            background: #ddd;
            color: #666;
        }
        .weather-btn.active {
            background: #5d9e5a;
            color: white;
        }
        
        /* Table Styles */
        .results-area {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: var(--header-bg);
            color: white;
            white-space: nowrap;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: white;
            margin-right: 2px;
        }
        .bg-fish { background-color: #6daae2; }
        .bg-bug { background-color: #8dbd5e; }
        .bg-loc-fish { background-color: #4a90e2; }
        .bg-loc-bug { background-color: #8d6e63; }
        .bg-price { background-color: #e2b346; color: black; }
        
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary-green);
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #ddd;
            border-radius: 10px 10px 0 0;
            margin-right: 5px;
            font-weight: bold;
            color: #666;
        }
        .tab.active {
            background: var(--primary-green);
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .note-text {
            font-size: 0.85em;
            color: #d9534f;
        }
        .time-badge {
            font-size: 0.8em;
            color: #666;
            background: #eee;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .type-icon {
            font-size: 1.2em;
            vertical-align: middle;
            margin-right: 4px;
        }


        /* --- Improved UI --- */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .filter-grid .input-group { margin-bottom: 0; }
        .sub-controls {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #b8d2ad;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 0 2px;
        }
        .checkbox-row input { width: auto; transform: scale(1.15); }
        .checkbox-row label { display: inline; margin: 0; }
        .summary-box {
            background: #fff8df;
            border: 1px solid #ead594;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 0.9em;
            line-height: 1.6;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 4px;
            white-space: nowrap;
        }
        .status-ending { background: #f8d7da; color: #842029; }
        .status-new { background: #d1e7dd; color: #0f5132; }
        .caught-btn {
            width: auto;
            min-width: 76px;
            padding: 6px 8px;
            font-size: 12px;
            background: #eee;
            color: #555;
            border: 1px solid #ccc;
        }
        .caught-btn.caught {
            background: #5d9e5a;
            color: white;
            border-color: #5d9e5a;
        }
        tr.is-caught { opacity: 0.58; }
        .countdown { color: var(--accent-brown); font-size: .9em; margin-top: 8px; }
        .name-search-row { display: flex; gap: 8px; }
        .name-search-row input { flex: 1; }
        .name-search-row button { width: auto; min-width: 84px; }
        .helper-text { font-size: .8em; color: #777; margin-top: 5px; }

        @media (max-width: 640px) {
            body { padding: 8px; }
            .container { padding: 12px; border-width: 1px; }
            h1 { font-size: 1.35rem; }
            .tabs { gap: 4px; }
            .tab { flex: 1; text-align: center; padding: 10px 6px; margin-right: 0; font-size: .9em; }
            .filter-grid { grid-template-columns: 1fr; }
            .results-area { overflow-x: visible; }
            #timeResultsTable, #timeResultsTable tbody, #timeResultsTable tr, #timeResultsTable td {
                display: block;
                width: 100%;
            }
            #timeResultsTable thead { display: none; }
            #timeResultsTable tr {
                box-sizing: border-box;
                background: white;
                border: 1px solid #ddd;
                border-left: 5px solid var(--primary-green);
                border-radius: 10px;
                padding: 10px;
                margin: 10px 0;
                box-shadow: 0 2px 5px rgba(0,0,0,.05);
            }
            #timeResultsTable td {
                border: 0;
                padding: 4px 0;
            }
            #timeResultsTable td:nth-child(2) { font-size: 1.12em; }
            #timeResultsTable td:last-child { margin-top: 5px; }
            .caught-btn { width: 100%; margin-top: 4px; }
        }

    </style>
</head>
<body>

<div class="container">
    <h1>🌳 おい森 生き物チェッカー (魚・虫 統合)</h1>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('searchTime')">日時から探す</div>
        <div class="tab" onclick="switchTab('searchName')">名前から探す</div>
    </div>

    <div id="searchTime" class="tab-content active">
        <div class="controls">
            <div class="input-group">
                <label>現在日時を使用</label>
                <button onclick="setNow()">今の日時にセット</button>
            </div>
            <div class="filter-grid">
                <div class="input-group">
                    <label for="inputDate">日付</label>
                    <input type="date" id="inputDate" onchange="searchByTime()">
                </div>
                <div class="input-group">
                    <label for="inputTime">時刻</label>
                    <input type="time" id="inputTime" onchange="searchByTime()">
                </div>
            </div>
            <div class="countdown" id="timeCountdown"></div>
            <div class="input-group" style="margin-top:15px;">
                <label>天気（シーラカンス・カタツムリ判定用）</label>
                <div class="weather-toggle">
                    <button class="weather-btn active" id="weatherClear" onclick="setWeather(false)">晴/曇</button>
                    <button class="weather-btn" id="weatherRain" onclick="setWeather(true)">雨/雪</button>
                </div>
            </div>

            <div class="sub-controls">
                <div class="filter-grid">
                    <div class="input-group">
                        <label for="typeFilter">種類</label>
                        <select id="typeFilter" onchange="searchByTime()">
                            <option value="all">魚・虫すべて</option>
                            <option value="fish">🐟 魚だけ</option>
                            <option value="bug">🦋 虫だけ</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="locationFilter">場所</label>
                        <select id="locationFilter" onchange="searchByTime()">
                            <option value="all">すべての場所</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="minPrice">最低売値</label>
                        <select id="minPrice" onchange="searchByTime()">
                            <option value="0">指定なし</option>
                            <option value="500">500ベル以上</option>
                            <option value="1000">1,000ベル以上</option>
                            <option value="3000">3,000ベル以上</option>
                            <option value="5000">5,000ベル以上</option>
                            <option value="10000">10,000ベル以上</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="sortOrder">並び順</label>
                        <select id="sortOrder" onchange="searchByTime()">
                            <option value="default">データ順</option>
                            <option value="priceDesc">売値が高い順</option>
                            <option value="priceAsc">売値が安い順</option>
                            <option value="name">名前順</option>
                            <option value="location">場所順</option>
                        </select>
                    </div>
                </div>
                <div class="input-group" style="margin-top:10px;">
                    <label for="quickNameFilter">名前で絞り込み</label>
                    <input id="quickNameFilter" type="search" placeholder="例: サメ、カブトムシ" oninput="searchByTime()">
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="uncaughtOnly" onchange="searchByTime()">
                    <label for="uncaughtOnly">未捕獲だけ表示</label>
                </div>
            </div>
        </div>
        <div id="seasonSummary" class="summary-box"></div>
        <div id="timeResultCount" style="font-weight:bold; margin-bottom:10px; color:var(--primary-green);"></div>
        <div class="results-area">
            <table id="timeResultsTable">
                <thead>
                    <tr>
                        <th>種類</th>
                        <th>名前</th>
                        <th>場所</th>
                        <th>売値</th>
                        <th>時間帯/備考</th>
                        <th>図鑑</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="searchName" class="tab-content">
        <div class="controls">
            <div class="input-group">
                <label for="creatureNameInput">生き物の名前を検索</label>
                <div class="name-search-row">
                    <input id="creatureNameInput" type="search" list="creatureNames" placeholder="名前を入力（例: シーラカンス）" oninput="searchByName()">
                    <button onclick="searchByName()">検索</button>
                </div>
                <datalist id="creatureNames"></datalist>
                <div class="helper-text">一部の名前でも候補を表示します。</div>
            </div>
        </div>
        <div id="nameResult" class="results-area"></div>
    </div>

    <div style="margin-top: 20px; font-size: 12px; color: #888; text-align: right;">
        データ出典: おいでよ どうぶつの森
    </div>
</div>

const combinedData = [...fishData, ...bugData];
let isRaining = false;

// ---------------------------------------------------------
// INITIALIZATION & STATE
// ---------------------------------------------------------
const caughtStorageKey = 'oimoriCreatureCheckerCaughtV2';
let caughtSet = new Set(JSON.parse(localStorage.getItem(caughtStorageKey) || '[]'));

function itemKey(item) {
    return `${item.type}:${item.no}:${item.name}`;
}

function saveCaught() {
    localStorage.setItem(caughtStorageKey, JSON.stringify([...caughtSet]));
}

window.onload = function() {
    setNow(false);
    populateDropdowns();
    populateLocationFilter();
    searchByTime();
};

function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    const headers = document.querySelectorAll('.tab');
    if(tabId === 'searchTime') headers[0].classList.add('active');
    else headers[1].classList.add('active');
    document.getElementById(tabId).classList.add('active');
}

function setWeather(raining) {
    isRaining = raining;
    document.getElementById('weatherClear').classList.toggle('active', !raining);
    document.getElementById('weatherRain').classList.toggle('active', raining);
    searchByTime();
}

function setNow(runSearch = true) {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('inputTime').value = `${hh}:${min}`;
    if (runSearch) searchByTime();
}

function populateDropdowns() {
    const list = document.getElementById('creatureNames');
    const names = [...new Set(combinedData.map(i => i.name.replace(/\(.*\)/, '')))];
    names.sort((a,b) => a.localeCompare(b, 'ja'));
    list.innerHTML = names.map(name => `<option value="${name}"></option>`).join('');
}

function populateLocationFilter() {
    const sel = document.getElementById('locationFilter');
    const locations = [...new Set(combinedData.map(i => i.loc))].sort((a,b) => a.localeCompare(b, 'ja'));
    locations.forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc;
        opt.textContent = loc;
        sel.appendChild(opt);
    });
}

// ---------------------------------------------------------
// LOGIC: PARSING TIME & DATE
// ---------------------------------------------------------
function getDayPeriod(hour) {
    if (hour >= 4 && hour < 9) return "朝";
    if (hour >= 9 && hour < 16) return "昼";
    if (hour >= 16 && hour < 21) return "夕";
    return "夜";
}

function parseMonth(str) {
    return parseInt(str.replace(/[^0-9]/g, ''));
}

function isAvailableInMonth(itemStart, itemEnd, currentMonth, isLateMonth) {
    if (itemStart === "-" || itemEnd === "-") return true;
    const startM = parseMonth(itemStart);
    const endM = parseMonth(itemEnd);
    if (currentMonth === startM && itemStart.includes("後半") && !isLateMonth) return false;
    if (currentMonth === endM && itemEnd.includes("前半") && isLateMonth) return false;
    if (startM <= endM) return currentMonth >= startM && currentMonth <= endM;
    return currentMonth >= startM || currentMonth <= endM;
}

function isAvailableAtTime(itemTime, currentHour) {
    if (itemTime === "-") return true;
    const currentPeriod = getDayPeriod(currentHour);
    return itemTime.includes(currentPeriod);
}

function checkExceptions(item, currentMonth, isLate, raining = isRaining) {
    if (item.type === 'fish') {
        if (item.note && item.note.includes("除く")) {
            if (item.note.includes("6月-9月") && currentMonth >= 6 && currentMonth <= 9) return false;
            if (item.note.includes("8月-9月前半")) {
                if (currentMonth === 8) return false;
                if (currentMonth === 9 && !isLate) return false;
            }
        }
        if (item.name === "シーラカンス" && !raining) return false;
    } else if (item.type === 'bug') {
        if (item.name === "カタツムリ" && !raining) return false;
    }
    return true;
}

function isMonthAvailable(item, month, isLate = false) {
    return isAvailableInMonth(item.start, item.end, month, isLate) && checkExceptions(item, month, isLate, true);
}

function monthStatus(item, currentMonth) {
    const nextMonth = currentMonth === 12 ? 1 : currentMonth + 1;
    const currentAny = isMonthAvailable(item, currentMonth, false) || isMonthAvailable(item, currentMonth, true);
    const nextAny = isMonthAvailable(item, nextMonth, false) || isMonthAvailable(item, nextMonth, true);
    if (currentAny && !nextAny) return 'ending';
    if (!currentAny && nextAny) return 'new';
    return '';
}

function updateCountdown(hour, minute) {
    const current = hour * 60 + minute;
    const boundaries = [4*60, 9*60, 16*60, 21*60, 28*60]; // 28:00 = 翌4:00
    const normalized = current < 4*60 ? current + 24*60 : current;
    const next = boundaries.find(b => b > normalized) ?? 28*60;
    const diff = next - normalized;
    const h = Math.floor(diff / 60);
    const m = diff % 60;
    const nextPeriod = getDayPeriod((Math.floor(next / 60)) % 24);
    document.getElementById('timeCountdown').textContent = `次の時間帯「${nextPeriod}」まで ${h ? h + '時間' : ''}${m}分`;
}

// ---------------------------------------------------------
// SEARCH FUNCTIONS
// ---------------------------------------------------------
function getSelectedDateParts() {
    const dateVal = document.getElementById('inputDate').value;
    const timeVal = document.getElementById('inputTime').value;
    if (!dateVal || !timeVal) return null;
    const [, monthStr, dayStr] = dateVal.split('-');
    const [hourStr, minuteStr] = timeVal.split(':');
    const day = parseInt(dayStr);
    return {
        month: parseInt(monthStr),
        day,
        hour: parseInt(hourStr),
        minute: parseInt(minuteStr),
        isLate: day >= 16
    };
}

function searchByTime() {
    const parts = getSelectedDateParts();
    if (!parts) return;
    updateCountdown(parts.hour, parts.minute);

    let results = combinedData.filter(item =>
        isAvailableInMonth(item.start, item.end, parts.month, parts.isLate) &&
        checkExceptions(item, parts.month, parts.isLate) &&
        isAvailableAtTime(item.time, parts.hour)
    );

    const typeFilter = document.getElementById('typeFilter').value;
    const locationFilter = document.getElementById('locationFilter').value;
    const minPrice = Number(document.getElementById('minPrice').value || 0);
    const quickName = document.getElementById('quickNameFilter').value.trim().toLowerCase();
    const uncaughtOnly = document.getElementById('uncaughtOnly').checked;

    if (typeFilter !== 'all') results = results.filter(i => i.type === typeFilter);
    if (locationFilter !== 'all') results = results.filter(i => i.loc === locationFilter);
    if (minPrice) results = results.filter(i => i.price >= minPrice);
    if (quickName) results = results.filter(i => i.name.toLowerCase().includes(quickName));
    if (uncaughtOnly) results = results.filter(i => !caughtSet.has(itemKey(i)));

    const sortOrder = document.getElementById('sortOrder').value;
    if (sortOrder === 'priceDesc') results.sort((a,b) => b.price - a.price);
    if (sortOrder === 'priceAsc') results.sort((a,b) => a.price - b.price);
    if (sortOrder === 'name') results.sort((a,b) => a.name.localeCompare(b.name, 'ja'));
    if (sortOrder === 'location') results.sort((a,b) => a.loc.localeCompare(b.loc, 'ja') || b.price-a.price);

    displaySeasonSummary(parts.month);
    displayResults(results, parts.month);
}

function displaySeasonSummary(currentMonth) {
    const nextMonth = currentMonth === 12 ? 1 : currentMonth + 1;
    const ending = combinedData.filter(i => monthStatus(i, currentMonth) === 'ending');
    const coming = combinedData.filter(i => monthStatus(i, currentMonth) === 'new');
    const unique = arr => [...new Set(arr.map(i => i.name.replace(/\(.*\)/, '')))];
    const endingNames = unique(ending);
    const comingNames = unique(coming);
    const preview = names => names.slice(0, 6).join('、') + (names.length > 6 ? ` ほか${names.length-6}種` : '');
    document.getElementById('seasonSummary').innerHTML =
        `<strong>季節の入れ替わり</strong><br>` +
        `🔴 ${currentMonth}月で終了: ${endingNames.length ? preview(endingNames) : 'なし'}<br>` +
        `🟢 ${nextMonth}月から出現: ${comingNames.length ? preview(comingNames) : 'なし'}`;
}

function displayResults(results, currentMonth) {
    const tbody = document.querySelector('#timeResultsTable tbody');
    tbody.innerHTML = '';
    const fishCount = results.filter(i => i.type === 'fish').length;
    const bugCount = results.filter(i => i.type === 'bug').length;
    document.getElementById('timeResultCount').innerHTML =
        `表示中: 計 ${results.length} 種類 (🐟 魚: ${fishCount} / 🦋 虫: ${bugCount})`;

    if (results.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">条件に合う生き物はいません</td></tr>';
        return;
    }

    results.forEach(item => {
        const tr = document.createElement('tr');
        const key = itemKey(item);
        const caught = caughtSet.has(key);
        if (caught) tr.classList.add('is-caught');
        const timeDisplay = item.time === '-' ? '一日中' : item.time;
        const noteDisplay = item.note ? `<br><span class="note-text">※${item.note}</span>` : '';
        const dispName = item.name.replace(/\(.*\)/, '');
        const typeBadge = item.type === 'fish'
            ? `<span class="badge bg-fish">🐟 魚</span>`
            : `<span class="badge bg-bug">🦋 虫</span>`;
        const locBadgeColor = item.type === 'fish' ? 'bg-loc-fish' : 'bg-loc-bug';
        const status = monthStatus(item, currentMonth);
        const statusBadge = status === 'ending'
            ? '<span class="status-badge status-ending">今月まで</span>'
            : '';

        tr.innerHTML = `
            <td>${typeBadge}</td>
            <td style="font-weight:bold; color:var(--primary-green);">${dispName}${statusBadge}</td>
            <td><span class="badge ${locBadgeColor}">${item.loc}</span></td>
            <td><span class="badge bg-price">${item.price.toLocaleString()}ベル</span></td>
            <td><span class="time-badge">${timeDisplay}</span>${noteDisplay}</td>
            <td><button class="caught-btn ${caught ? 'caught' : ''}" onclick='toggleCaught(${JSON.stringify(key)})'>${caught ? '✓ 捕獲済み' : '未捕獲'}</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function toggleCaught(key) {
    if (caughtSet.has(key)) caughtSet.delete(key);
    else caughtSet.add(key);
    saveCaught();
    searchByTime();
    if (document.getElementById('searchName').classList.contains('active')) searchByName();
}

function searchByName() {
    const query = document.getElementById('creatureNameInput').value.trim().toLowerCase();
    const div = document.getElementById('nameResult');
    div.innerHTML = '';
    if (!query) return;

    const matches = combinedData.filter(item =>
        item.name.replace(/\(.*\)/, '').toLowerCase().includes(query)
    );
    if (matches.length === 0) {
        div.innerHTML = '<div class="summary-box">該当する生き物が見つかりません。</div>';
        return;
    }

    let html = '';
    matches.forEach(item => {
        const seasonDisplay = (item.start === '-') ? '一年中' : `${item.start} 〜 ${item.end}`;
        const timeDisplay = (item.time === '-') ? '一日中' : item.time;
        const icon = item.type === 'fish' ? '🐟' : '🦋';
        const key = itemKey(item);
        const caught = caughtSet.has(key);
        html += `
        <table style="width:100%; border-top: 3px solid var(--primary-green); margin-bottom:15px;">
            <tr><th style="width:30%">名前</th><td style="font-size:1.2em; font-weight:bold;"><span class="type-icon">${icon}</span>${item.name}</td></tr>
            <tr><th>場所</th><td>${item.loc}</td></tr>
            <tr><th>売値</th><td>${item.price.toLocaleString()} ベル</td></tr>
            <tr><th>時期</th><td>${seasonDisplay}</td></tr>
            <tr><th>時間帯</th><td>${timeDisplay}</td></tr>
            <tr><th>備考</th><td style="color:#d9534f;">${item.note || 'なし'}</td></tr>
            <tr><th>図鑑</th><td><button class="caught-btn ${caught ? 'caught' : ''}" onclick='toggleCaught(${JSON.stringify(key)})'>${caught ? '✓ 捕獲済み' : '未捕獲'}</button></td></tr>
        </table>`;
    });

    html += `
        <div style="margin-top:10px; background:#fff; padding:10px; border:1px dashed #ccc; font-size:0.9em;">
            <strong>凡例 (時間帯):</strong><br>
            朝: 4:00～8:59<br>
            昼: 9:00～15:59<br>
            夕: 16:00～20:59<br>
            夜: 21:00～3:59
        </div>`;
    div.innerHTML = html;
}
